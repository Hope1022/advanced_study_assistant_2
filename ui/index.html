<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biology Tutor — Grade 9</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --green-deep:   #1a4731;
            --green-mid:    #2d6a4f;
            --green-light:  #52b788;
            --green-pale:   #d8f3dc;
            --white:        #ffffff;
            --grey-soft:    #f4f6f4;
            --grey-border:  #e0e8e2;
            --text-dark:    #1a2e1f;
            --text-muted:   #5a7263;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--grey-soft);
            background-image: radial-gradient(circle at 1px 1px, var(--grey-border) 1px, transparent 0);
            background-size: 24px 24px;
            color: var(--text-dark);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .app {
            width: 100%;
            max-width: 720px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            background: var(--white);
            border-radius: 16px;
            box-shadow: 0 4px 32px rgba(26, 71, 49, 0.12);
            overflow: hidden;
        }

        /* header */
        .header {
            background: var(--green-deep);
            padding: 18px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-icon {
            width: 36px;
            height: 36px;
            background: var(--green-light);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .header-text h1 {
            font-size: 15px;
            font-weight: 600;
            color: var(--white);
            letter-spacing: 0.01em;
        }

        .header-text p {
            font-size: 12px;
            color: var(--green-pale);
            margin-top: 2px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--green-light);
            border-radius: 50%;
            margin-left: auto;
            box-shadow: 0 0 0 2px rgba(82, 183, 136, 0.3);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 2px rgba(82, 183, 136, 0.3); }
            50%       { box-shadow: 0 0 0 5px rgba(82, 183, 136, 0.1); }
        }

        /* chat area */
        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .chat::-webkit-scrollbar { width: 4px; }
        .chat::-webkit-scrollbar-track { background: transparent; }
        .chat::-webkit-scrollbar-thumb { background: var(--grey-border); border-radius: 2px; }

        /* welcome message */
        .welcome {
            text-align: center;
            padding: 32px 20px;
            color: var(--text-muted);
        }

        .welcome-leaf {
            font-size: 40px;
            margin-bottom: 12px;
        }

        .welcome h2 {
            font-size: 17px;
            font-weight: 600;
            color: var(--green-deep);
            margin-bottom: 6px;
        }

        .welcome p {
            font-size: 13px;
            line-height: 1.6;
            max-width: 320px;
            margin: 0 auto;
        }

        /* messages */
        .message {
            display: flex;
            gap: 10px;
            max-width: 88%;
            animation: fadeUp 0.2s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(6px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.bot {
            align-self: flex-start;
        }

        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .message.user .avatar {
            background: var(--green-pale);
        }

        .message.bot .avatar {
            background: var(--green-deep);
        }

        .bubble {
            padding: 11px 15px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.65;
        }

        .message.user .bubble {
            background: var(--green-mid);
            color: var(--white);
            border-bottom-right-radius: 4px;
        }

        .message.bot .bubble {
            background: var(--grey-soft);
            color: var(--text-dark);
            border-bottom-left-radius: 4px;
            border: 1px solid var(--grey-border);
        }

        /* growing plant loading animation */
        .thinking {
            display: flex;
            align-items: flex-end;
            gap: 5px;
            padding: 14px 16px;
            background: var(--grey-soft);
            border: 1px solid var(--grey-border);
            border-radius: 14px;
            border-bottom-left-radius: 4px;
        }

        .stem {
            width: 3px;
            border-radius: 3px;
            background: var(--green-light);
            animation: grow 1s ease-in-out infinite;
        }

        .stem:nth-child(1) { height: 8px;  animation-delay: 0s; }
        .stem:nth-child(2) { height: 8px;  animation-delay: 0.15s; }
        .stem:nth-child(3) { height: 8px;  animation-delay: 0.3s; }

        @keyframes grow {
            0%, 100% { height: 6px;  opacity: 0.4; background: var(--green-light); }
            50%       { height: 18px; opacity: 1;   background: var(--green-deep); }
        }

        /* input area */
        .input-area {
            padding: 16px 20px;
            border-top: 1px solid var(--grey-border);
            display: flex;
            gap: 10px;
            background: var(--white);
        }

        input[type="text"] {
            flex: 1;
            padding: 11px 16px;
            border: 1.5px solid var(--grey-border);
            border-radius: 24px;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            color: var(--text-dark);
            background: var(--grey-soft);
            outline: none;
            transition: border-color 0.15s;
        }

        input[type="text"]:focus {
            border-color: var(--green-light);
            background: var(--white);
        }

        input[type="text"]::placeholder {
            color: var(--text-muted);
        }

        button {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            background: var(--green-deep);
            color: var(--white);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: background 0.15s, transform 0.1s;
        }

        button:hover  { background: var(--green-mid); }
        button:active { transform: scale(0.94); }

        button svg {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: white;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        button:disabled {
            background: var(--grey-border);
            cursor: not-allowed;
            transform: none;
        }
    </style>
</head>
<body>
<div class="app">

    <div class="header">
        <div class="header-icon">🌿</div>
        <div class="header-text">
            <h1>Biology Tutor</h1>
            <p>Grade 9 · Powered by AI</p>
        </div>
        <div class="status-dot"></div>
    </div>

    <div class="chat" id="chat">
        <div class="welcome">
            <div class="welcome-leaf">🌱</div>
            <h2>Ready to learn</h2>
            <p>Ask any question from your Grade 9 Biology textbook and I will explain it clearly.</p>
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="input" placeholder="Ask a biology question..." autocomplete="off"/>
        <button id="send-btn" onclick="ask()">
            <svg viewBox="0 0 24 24">
                <line x1="22" y1="2" x2="11" y2="13"/>
                <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
        </button>
    </div>

</div>

<script>
    const chat    = document.getElementById("chat")
    const input   = document.getElementById("input")
    const sendBtn = document.getElementById("send-btn")

    function addMessage(text, role) {
        const welcome = document.querySelector(".welcome")
        if (welcome) welcome.remove()

        const msg    = document.createElement("div")
        msg.className = `message ${role}`

        const avatar  = document.createElement("div")
        avatar.className = "avatar"
        avatar.textContent = role === "user" ? "👤" : "🌿"

        const bubble  = document.createElement("div")
        bubble.className = "bubble"
        bubble.textContent = text

        msg.appendChild(avatar)
        msg.appendChild(bubble)
        chat.appendChild(msg)
        chat.scrollTop = chat.scrollHeight
        return bubble
    }

    function showThinking() {
        const msg    = document.createElement("div")
        msg.className = "message bot"
        msg.id        = "thinking"

        const avatar  = document.createElement("div")
        avatar.className = "avatar"
        avatar.textContent = "🌿"

        const bubble  = document.createElement("div")
        bubble.className = "thinking"
        bubble.innerHTML = `<div class="stem"></div><div class="stem"></div><div class="stem"></div>`

        msg.appendChild(avatar)
        msg.appendChild(bubble)
        chat.appendChild(msg)
        chat.scrollTop = chat.scrollHeight
    }

    function removeThinking() {
        const el = document.getElementById("thinking")
        if (el) el.remove()
    }

    async function ask() {
        const question = input.value.trim()
        if (!question) return

        addMessage(question, "user")
        input.value   = ""
        input.disabled = true
        sendBtn.disabled = true

        showThinking()

        try {
            const res  = await fetch("/ask", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ question })
            })
            const data = await res.json()
            removeThinking()
            addMessage(data.answer, "bot")
        } catch (err) {
            removeThinking()
            addMessage("Something went wrong. Please try again.", "bot")
        }

        input.disabled   = false
        sendBtn.disabled = false
        input.focus()
    }

    input.addEventListener("keypress", e => {
        if (e.key === "Enter") ask()
    })
</script>
</body>
</html>
